<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>PETIVA - Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      max-width: 420px;
      width: 100%;
    }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 0.75rem; }
    p  { font-size: 0.95rem; color: #64748b; line-height: 1.5; margin-bottom: 1.5rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #eff6ff; color: #2563eb;
      border-radius: 9999px; padding: 0.35rem 0.85rem;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    button {
      background: #2563eb; color: #ffffff;
      border: none; border-radius: 9999px;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
      transition: background-color 0.2s;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🐾</div>
    <div class="badge">PETIVA Healthcare</div>
    <h1>You are currently offline</h1>
    <p>Reconnect to the internet to access your pet's health records, appointments, and live assistance.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
